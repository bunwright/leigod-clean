name: Release notes

on:
  push:
    branches: [main]
    paths:
      - CHANGELOG.md
      - scripts/extract-release-notes.cjs
      - .github/workflows/release-notes.yml

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Synchronize published release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t tags < <(sed -nE 's/^## \[([0-9]+\.[0-9]+\.[0-9]+)\].*/v\1/p' CHANGELOG.md)
          for tag in "${tags[@]}"; do
            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              continue
            fi
            notes="artifacts/release-notes/$tag.md"
            node scripts/extract-release-notes.cjs "$tag" "$notes" --historical
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "LeigodClean $tag" \
              --notes-file "$notes"
          done
